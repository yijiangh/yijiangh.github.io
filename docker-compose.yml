services:
  jekyll:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yijiang-website-jekyll
    volumes:
      # Mount the entire project directory
      # _site/ is a git submodule - built files will be written there
      - .:/srv/jekyll
      # Use a named volume for bundler gems to persist across rebuilds
      - bundle_cache:/usr/local/bundle
    ports:
      # Jekyll server (for preview)
      - "4000:4000"
      # LiveReload
      - "35729:35729"
    environment:
      # Set to 'production' for final builds, 'development' for preview
      - JEKYLL_ENV=production
    # Keep container running for devcontainer
    command: sleep infinity
    stdin_open: true
    tty: true

  # One-off build service - run with: docker-compose run --rm build
  build:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=production
    command: bash -c "bundle install && bundle exec jekyll build --destination /srv/jekyll/_site"

volumes:
  bundle_cache: